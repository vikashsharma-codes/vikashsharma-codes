<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Radial Cyan Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Top Neon Accent Line -->
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#0EA5E9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.14" />
    </pattern>

    <!-- Text Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .badge-text { font-size: 11px; font-weight: 700; fill: #38BDF8; letter-spacing: 2px; }
    .title-text { font-size: 42px; font-weight: 900; fill: #FFFFFF; letter-spacing: 4px; }
    .subtitle-text { font-size: 13px; font-weight: 600; fill: #94A3B8; letter-spacing: 2.5px; }
    .status-text { font-size: 12px; font-weight: 500; fill: #64748B; letter-spacing: 0.5px; }
  </style>

  <!-- Background Layer with border -->
  <rect width="900" height="220" rx="12" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Overlay -->
  <rect width="900" height="220" rx="12" fill="url(#techGrid)" />

  <!-- Center Ambient Glow -->
  <rect width="900" height="220" rx="12" fill="url(#centerGlow)" />

  <!-- Top Decorative Accent Bar -->
  <rect x="150" y="0" width="600" height="3" fill="url(#neonBar)" />

  <!-- Executive Role Tag Pill -->
  <g transform="translate(325, 34)">
    <rect width="250" height="26" rx="13" fill="#0B132B" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
    <text x="125" y="17" class="mono badge-text" text-anchor="middle">FULL-STACK ENGINEER</text>
  </g>

  <!-- Main Name Header -->
  <text x="450" y="112" class="sans title-text" text-anchor="middle" filter="url(#glowFilter)">VIKASH SHARMA</text>

  <!-- Architecture Subtitle -->
  <text x="450" y="148" class="sans subtitle-text" text-anchor="middle">WEB ARCHITECTURE  •  PHP &amp; MYSQL  •  SYSTEM INTEGRATIONS</text>

  <!-- Live Status Bar -->
  <g transform="translate(450, 185)">
    <!-- Active Green Beacon -->
    <circle cx="-135" cy="-4" r="4.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-135" cy="-4" r="8" fill="#22C55E" fill-opacity="0.2">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-120" y="0" class="sans status-text" text-anchor="start">Open to Technical Collaborations &amp; Enterprise Development</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="219" x2="650" y2="219" stroke="url(#neonBar)" stroke-width="1" />
</svg>
